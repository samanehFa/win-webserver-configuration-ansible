---
- name: Install IIS and required features
  ansible.windows.win_feature:
    name:
      - Web-Static-Content
      - Web-Default-Doc
      - Web-Http-Errors
      - Web-Http-Redirect
      - Web-Asp-Net45
      - Web-Net-Ext45
      - Web-ISAPI-Ext
      - Web-ISAPI-Filter
      - Web-Http-Logging
      - Web-Http-Tracing
      - Web-Request-Monitor
      - Web-Filtering
      - Web-IP-Security
      - Web-Basic-Auth
      - Web-Windows-Auth
      - Web-Client-Auth
      - Web-Stat-Compression
      - Web-Dyn-Compression
      - Web-Mgmt-Console
      - Web-Scripting-Tools
      - Web-Ftp-Service
      - Web-WebSockets
    state: present
